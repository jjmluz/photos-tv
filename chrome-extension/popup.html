<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>Fotos TV</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Fotos TV</h1>
  <p class="hint">Copie o endereço e o código do ecrã de início de sessão da TV.</p>
  <form id="form">
    <label>Endereço da TV
      <input id="address" placeholder="192.168.1.20:8765" required spellcheck="false">
    </label>
    <label>Código
      <input id="code" placeholder="XXXX-XXXX-XXXX" required spellcheck="false" autocomplete="off">
    </label>
    <button type="submit">Guardar e sincronizar</button>
  </form>
  <p id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
